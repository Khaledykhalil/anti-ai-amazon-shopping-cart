<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-AI Amazon Shopping Cart</title>
  <link rel="stylesheet" href="./src/popup/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-shield">🛡️</div>
        <div>
          <h1 class="title">Anti-AI Amazon Cart</h1>
          <p class="subtitle" id="active-tab-status">Scanning Amazon listings</p>
        </div>
      </div>
      <label class="switch" title="Toggle extension on/off">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Metrics Cards -->
    <section class="metrics-grid">
      <div class="metric-card">
        <span class="metric-val" id="stat-filtered">0</span>
        <span class="metric-label">AI Blocked</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="stat-swapped">0</span>
        <span class="metric-label">Real Photos</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="stat-scanned">0</span>
        <span class="metric-label">Scanned</span>
      </div>
    </section>

    <!-- Main Filtering Mode Selection -->
    <section class="section">
      <h2 class="section-title">Action on AI Content</h2>
      <div class="mode-selector">
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="blur" checked>
          <div class="mode-card">
            <span class="mode-icon">🛡️</span>
            <div>
              <div class="mode-name">Blur & Shield</div>
              <div class="mode-desc">Frosted glass with real buyer photo swap</div>
            </div>
          </div>
        </label>
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="hide">
          <div class="mode-card">
            <span class="mode-icon">🚫</span>
            <div>
              <div class="mode-name">Hide Completely</div>
              <div class="mode-desc">Collapse and remove AI items from results</div>
            </div>
          </div>
        </label>
        <label class="mode-option">
          <input type="radio" name="filter-mode" value="replace-real">
          <div class="mode-card">
            <span class="mode-icon">📸</span>
            <div>
              <div class="mode-name">Real Photos Only</div>
              <div class="mode-desc">Auto-replace AI hero photos with buyer photos</div>
            </div>
          </div>
        </label>
      </div>
    </section>

    <!-- Sensitivity Slider -->
    <section class="section">
      <div class="section-header-row">
        <h2 class="section-title">Detection Sensitivity</h2>
        <span class="sensitivity-badge" id="sensitivity-badge">Balanced</span>
      </div>
      <input type="range" min="1" max="3" value="2" class="range-slider" id="sensitivity-slider">
      <div class="range-labels">
        <span>Relaxed</span>
        <span>Balanced</span>
        <span>Strict</span>
      </div>
    </section>

    <!-- Specific Category Toggles -->
    <section class="section">
      <h2 class="section-title">Protected Categories</h2>
      <div class="toggle-list">
        <label class="toggle-row">
          <span>👗 AI Clothing Models & Mannequins</span>
          <input type="checkbox" id="toggle-clothing" checked>
        </label>
        <label class="toggle-row">
          <span>🍔 AI Food & Grocery Photography</span>
          <input type="checkbox" id="toggle-food" checked>
        </label>
        <label class="toggle-row">
          <span>✍️ AI Marketing Buzzword Slop</span>
          <input type="checkbox" id="toggle-marketing" checked>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-links">
        <a href="https://github.com/Khaledykhalil/anti-ai-amazon-shopping-cart" target="_blank" rel="noopener">GitHub</a>
        <span>•</span>
        <span id="version-tag">v1.0.0</span>
      </div>
      <button type="button" class="btn-refresh" id="btn-refresh">Reload Page</button>
    </footer>
  </div>

  <script type="module" src="./src/popup/popup.ts"></script>
</body>
</html>
