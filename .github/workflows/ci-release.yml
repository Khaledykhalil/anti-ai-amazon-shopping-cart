name: CI & Store Release Artifacts

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run compile

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Package Chrome MV3 Zip
        run: npm run zip:chrome

      - name: Package Firefox MV2 Zip
        run: npm run zip:firefox

      - name: Build Safari Extension Bundle
        run: npm run build:safari

      - name: Upload Store Packages
        uses: actions/upload-artifact@v4
        with:
          name: blurify-store-packages
          path: |
            .output/*.zip
            .output/safari-mv2/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
